<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JarvisHub - Meu Script</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@700&family=Impact&family=Poppins:wght@700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Fundo com a imagem do meme bem esticada */
            background-image: url('https://i.ibb.co/3ykG4S2/obrahma.jpg');
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #ff0055;
            border-radius: 25px;
            padding: 35px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 0 30px #ff0055, 0 0 15px #ffe600;
            text-align: center;
        }

        h1 {
            font-family: 'Impact', 'Poppins', sans-serif;
            font-size: 3rem;
            color: #ffe600;
            text-shadow: 3px 3px 0px #ff0055, 6px 6px 0px #000;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h2 {
            color: #00ffcc;
            font-size: 1.6rem;
            text-shadow: 2px 2px 0px #000;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        p {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 25px;
            font-size: 1.1rem;
            text-shadow: 1px 1px 2px #000;
        }

        .code-box {
            background-color: #111111;
            border: 3px solid #00ffcc;
            border-radius: 12px;
            padding: 18px;
            word-break: break-all;
            margin-bottom: 25px;
            text-align: left;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        code {
            font-family: 'Fira Code', monospace;
            color: #ffe600;
            font-size: 0.95rem;
            font-weight: 700;
        }

        .btn-copy {
            width: 100%;
            background: linear-gradient(135deg, #ff0055 0%, #ff5500 100%);
            color: #ffffff;
            border: 3px solid #ffe600;
            padding: 18px;
            border-radius: 15px;
            font-size: 1.3rem;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 5px 20px rgba(255, 0, 85, 0.6);
            text-shadow: 2px 2px 0px #000;
        }

        .btn-copy:hover {
            transform: scale(1.03);
            background: linear-gradient(135deg, #ff5500 0%, #ff0055 100%);
            box-shadow: 0 5px 30px #ffe600;
        }

        .btn-copy:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>JarvisHub</h1>
        <h2>Meu Script</h2>
        <p>Clique no botão abaixo para copiar o script e execute no seu jogo:</p>
        
        <div class="code-box">
            <code id="scriptCode">loadstring(game:HttpGet("https://raw.githubusercontent.com/Wwilliam779/JarvisHub/refs/heads/main/README.md"))()</code>
        </div>

        <button class="btn-copy" onclick="copyScript()">Copiar Script</button>
    </div>

    <script>
        function copyScript() {
            const textToCopy = document.getElementById("scriptCode").innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const button = document.querySelector(".btn-copy");
                button.innerText = "✓ Copiado com Sucesso!";
                button.style.background = "linear-gradient(135deg, #00ffcc 0%, #009966 100%)";
                button.style.borderColor = "#ffffff";
                
                setTimeout(() => {
                    button.innerText = "Copiar Script";
                    button.style.background = "linear-gradient(135deg, #ff0055 0%, #ff5500 100%)";
                    button.style.borderColor = "#ffe600";
                }, 2000);
            });
        }
    </script>

</body>
</html>
