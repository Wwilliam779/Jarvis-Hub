<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JarvisHub Script</title>
    <!-- Fontes modernas do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Efeitos de brilho de fundo */
        .bg-glow-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(56, 189, 248, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            top: 10%;
            left: 15%;
            z-index: 0;
        }

        .bg-glow-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(168, 85, 247, 0.15);
            filter: blur(100px);
            border-radius: 50%;
            bottom: 10%;
            right: 15%;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 20px rgba(56, 189, 248, 0.1);
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 8px #4ade80;
        }

        h1 {
            font-size: 2.3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p {
            color: #94a3b8;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .code-box {
            background-color: #030712;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 18px;
            position: relative;
            word-break: break-all;
            margin-bottom: 25px;
            text-align: left;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        code {
            font-family: 'Fira Code', monospace;
            color: #38bdf8;
            font-size: 0.88rem;
            line-height: 1.5;
        }

        .btn-copy {
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: #ffffff;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
            background: linear-gradient(135deg, #0369a1 0%, #1d4ed8 100%);
        }

        .btn-copy:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <div class="badge">
            <span class="status-dot"></span> Online & Atualizado
        </div>

        <h1>JarvisHub</h1>
        <p>Clique no botão abaixo para copiar o script e execute no seu jogo:</p>
        
        <div class="code-box">
            <code id="scriptCode">loadstring(game:HttpGet("https://raw.githubusercontent.com/Wwilliam779/JarvisHub/refs/heads/main/README.md"))()</code>
        </div>

        <button class="btn-copy" onclick="copyScript()">Copiar Script</button>
    </div>

    <script>
        function copyScript() {
            const textToCopy = document.getElementById("scriptCode").innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const button = document.querySelector(".btn-copy");
                button.innerText = "✓ Copiado com Sucesso!";
                button.style.background = "linear-gradient(135deg, #16a34a 0%, #15803d 100%)";
                button.style.boxShadow = "0 4px 15px rgba(22, 163, 74, 0.4)";
                
                setTimeout(() => {
                    button.innerText = "Copiar Script";
                    button.style.background = "linear-gradient(135deg, #0284c7 0%, #2563eb 100%)";
                    button.style.boxShadow = "0 4px 15px rgba(2, 132, 199, 0.4)";
                }, 2000);
            });
        }
    </script>

</body>
</html>
