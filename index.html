<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JarvisHub Script</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 30px;
            max-width: 650px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 1.8rem;
            text-align: center;
        }

        p {
            color: #94a3b8;
            margin-bottom: 20px;
            text-align: center;
            font-size: 0.95rem;
        }

        .code-box {
            background-color: #090d16;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            position: relative;
            word-break: break-all;
            margin-bottom: 20px;
        }

        code {
            font-family: 'Courier New', Courier, monospace;
            color: #4ade80;
            font-size: 0.9rem;
        }

        .btn-copy {
            width: 100%;
            background-color: #0284c7;
            color: #ffffff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-copy:hover {
            background-color: #0369a1;
        }

        .btn-copy:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>JarvisHub Script</h1>
        <p>Clique no botão abaixo para copiar o script e execute no seu jogo:</p>
        
        <div class="code-box">
            <code id="scriptCode">loadstring(game:HttpGet("https://raw.githubusercontent.com/Wwilliam779/JarvisHub/refs/heads/main/README.md"))()</code>
        </div>

        <button class="btn-copy" onclick="copyScript()">Copiar Script</button>
    </div>

    <script>
        function copyScript() {
            const textToCopy = document.getElementById("scriptCode").innerText;
            navigator.clipboard.writeText(textToCopy).then(() => {
                const button = document.querySelector(".btn-copy");
                button.innerText = "Copiado com Sucesso!";
                button.style.backgroundColor = "#16a34a";
                
                setTimeout(() => {
                    button.innerText = "Copiar Script";
                    button.style.backgroundColor = "#0284c7";
                }, 2000);
            });
        }
    </script>

</body>
</html>
